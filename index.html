<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="tUZgnRuVb3T6g6v-G6kdM5ZSDvsxjGFrSP-NoYCAh1s" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Game Project — Three.js GTA Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
            text-align: center;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            z-index: 100;
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; color: #66fcf1; font-size: 1.8rem; text-shadow: 0 0 10px rgba(102,252,241,0.5); }
        p { margin: 0; color: #8f9cae; font-size: 1rem; }
        /* Контейнер для 3D графики */
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
    <!-- Подключаем 3D движок Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="info">
        <h1>Project: 3D GTA (Pre-Alpha 0.1)</h1>
        <p>Use <b>W, A, S, D</b> or <b>Arrow Keys</b> to move your 3D Character</p>
    </div>

    <!-- Сюда движок будет выводить 3D картинку -->
    <div id="game-container"></div>

    <script>
        // 1. НАСТРОЙКА СЦЕНЫ, КАМЕРЫ И ОТРИСОВЩИКА
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0c14); // Цвет неба/окружения

        // Камера: угол обзора 45 градусов, пропорции экрана
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        // Ставим камеру сверху и сзади (как в играх от третьего лица)
        camera.position.set(0, 15, 25); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Включаем тени
        container.appendChild(renderer.domElement);

        // 2. ОСВЕЩЕНИЕ (Без света в 3D всё будет абсолютно черным)
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Общий мягкий свет
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2); // Солнечный свет, дающий тени
        dirLight.position.set(10, 20, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. СОЗДАНИЕ МИРА (Земля/Дорога)
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1f2833, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2; // Кладем на пол
        floor.receiveShadow = true;
        scene.add(floor);

        // Добавим простую сетку на пол, чтобы чувствовать скорость и расстояние
        const gridHelper = new THREE.GridHelper(100, 50, 0x45f3ff, 0x252b36);
        gridHelper.position.y = 0.01; // Чуть выше пола, чтобы не мигало
        scene.add(gridHelper);

        // 4. СОЗДАНИЕ 3D ПЕРСОНАЖА (Игрок)
        const playerGeometry = new THREE.BoxGeometry(2, 2, 2); // Куб размером 2х2х2 метра
        const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, metalness: 0.2 });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.y = 1; // Поднимаем куб, чтобы он стоял НА земле, а не проваливался наполовину
        player.castShadow = true;
        scene.add(player);

        // 5. УПРАВЛЕНИЕ КЛАВИАТУРОЙ
        const keys = {};
        const playerSpeed = 0.3;

        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // 6. ИГРОВОЙ ЦИКЛ (Обновление кадров)
        function animate() {
            requestAnimationFrame(animate);

            // Логика движения персонажа
            if (keys['KeyW'] || keys['ArrowUp']) {
                player.position.z -= playerSpeed; // Движение вперед (вглубь экрана)
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                player.position.z += playerSpeed; // Движение назад
            }
            if (keys['KeyA'] || keys['ArrowLeft']) {
                player.position.x -= playerSpeed; // Движение влево
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                player.position.x += playerSpeed; // Движение вправо
            }

            // Камера плавно следует за кубом-персонажем
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 25; // Держим дистанцию сзади
            camera.lookAt(player.position);

            // Отрендерить сцену
            renderer.render(scene, camera);
        }

        // Поддержка изменения размеров окна браузера
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск анимации
        animate();
    </script>
</body>
</html>
